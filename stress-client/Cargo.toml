[package]
name = "massive_game_server_stress_client"
version = "0.1.0"
edition = "2021"
description = "Stress test client for massive_game_server. Connects via WebRTC and exercises the FlatBuffers game protocol."
license = "MIT"
repository = "https://github.com/TrebuchetNetwork/massive_game_server"

[dependencies]
# Async runtime
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

# WebRTC (must match server version for interop)
webrtc = "0.11"

# WebSocket for signaling
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# FlatBuffers (must match server/protocol crate version)
flatbuffers = "25.2.10"

# Protocol crate (shared FlatBuffers generated code)
massive_game_server_protocol = { version = "0.1.0", path = "../protocol" }

# Serialization (signaling messages are JSON)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Binary data
bytes = "1.6"

# Utilities
rand = "0.8"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
