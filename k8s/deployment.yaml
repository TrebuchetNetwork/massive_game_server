apiVersion: apps/v1
kind: Deployment
metadata:
  name: massive-game-server
  labels:
    app: massive-game-server
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: massive-game-server
  template:
    metadata:
      labels:
        app: massive-game-server
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: massive-game-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50000
              hostPort: 50000
              name: webrtc-udp-0
              protocol: UDP
            - containerPort: 50001
              hostPort: 50001
              name: webrtc-udp-1
              protocol: UDP
            - containerPort: 50002
              hostPort: 50002
              name: webrtc-udp-2
              protocol: UDP
            - containerPort: 50003
              hostPort: 50003
              name: webrtc-udp-3
              protocol: UDP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: massive-game-server-config
            - secretRef:
                name: massive-game-server-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: artifacts
              mountPath: /app/artifacts
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
      volumes:
        - name: data
          emptyDir: {}
        - name: artifacts
          emptyDir: {}
