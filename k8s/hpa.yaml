apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: massive-game-server
  labels:
    app: massive-game-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: massive-game-server
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
