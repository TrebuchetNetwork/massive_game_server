apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: massive-game-server-network
  labels:
    app: massive-game-server
spec:
  podSelector:
    matchLabels:
      app: massive-game-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: UDP
          port: 50000
        - protocol: UDP
          port: 50001
        - protocol: UDP
          port: 50002
        - protocol: UDP
          port: 50003
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: coredns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
