apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: massive-game-server-ingress
  labels:
    app: massive-game-server
spec:
  podSelector:
    matchLabels:
      app: massive-game-server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
