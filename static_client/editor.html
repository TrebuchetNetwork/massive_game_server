<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Massive Map Editor</title>
  <style>
    :root {
      --bg: #08131d;
      --panel: rgba(12, 26, 40, 0.92);
      --ink: #e7f3ff;
      --muted: #89a7c3;
      --accent: #5ad4ff;
      --danger: #ff6e6e;
      --grid: rgba(138, 185, 226, 0.2);
      --wall: #8fc5ff;
      --wall-d: #ffc66d;
      --pickup: #8dffb4;
      --zone-slow: rgba(255, 200, 60, 0.35);
      --zone-damage: rgba(255, 80, 80, 0.35);
      --zone-boost: rgba(80, 255, 180, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 80% -10%, rgba(62, 181, 255, 0.22), transparent 60%),
        radial-gradient(1200px 700px at -10% 100%, rgba(0, 170, 120, 0.2), transparent 58%),
        var(--bg);
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 14px;
      padding: 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid rgba(173, 216, 255, 0.2);
      border-radius: 14px;
      padding: 14px;
      backdrop-filter: blur(6px);
    }
    .title { margin: 0 0 10px; font-size: 1.12rem; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    button, select, input, textarea {
      background: rgba(9, 21, 34, 0.9);
      color: var(--ink);
      border: 1px solid rgba(173, 216, 255, 0.28);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    button { cursor: pointer; }
    button.active { border-color: var(--accent); color: var(--accent); }
    button.warn { border-color: var(--danger); color: #ffd7d7; }
    label { color: var(--muted); font-size: 0.9rem; display: block; margin: 8px 0 6px; }
    textarea {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
    }
    .hint { color: var(--muted); font-size: 0.82rem; margin: 0 0 8px; }
    .viewport {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(173, 216, 255, 0.25);
      background: rgba(4, 13, 21, 0.84);
    }
    canvas { display: block; width: 100%; height: calc(100vh - 28px); }
    .status {
      position: absolute;
      left: 10px;
      bottom: 10px;
      background: rgba(4, 13, 22, 0.85);
      border: 1px solid rgba(173, 216, 255, 0.2);
      border-radius: 8px;
      padding: 6px 8px;
      color: var(--muted);
      font-size: 0.8rem;
      pointer-events: none;
    }
    @media (max-width: 980px) {
      body { grid-template-columns: 1fr; }
      canvas { height: 62vh; }
    }
  </style>
</head>
<body>
  <aside class="panel">
    <h1 class="title">Massive Map Editor</h1>
    <p class="hint">World: x [-800, 800], y [-600, 600]. Drag for walls. Click for pickups.</p>

    <div class="row">
      <button id="toolWall" class="active">Wall</button>
      <button id="toolPickup">Pickup</button>
      <button id="toolZone">Zone</button>
      <button id="toolDelete">Delete</button>
      <button id="toolPan">Pan</button>
    </div>

    <label for="pickupType">Pickup Type</label>
    <select id="pickupType">
      <option value="health">Health</option>
      <option value="ammo">Ammo</option>
      <option value="speed_boost">Speed Boost</option>
      <option value="damage_boost">Damage Boost</option>
      <option value="shield">Shield</option>
      <option value="weaponcrate_shotgun">Weapon Crate (Shotgun)</option>
      <option value="weaponcrate_rifle">Weapon Crate (Rifle)</option>
      <option value="weaponcrate_sniper">Weapon Crate (Sniper)</option>
    </select>

    <label for="zoneType">Zone Type</label>
    <select id="zoneType">
      <option value="slow_zone">Slow Zone</option>
      <option value="damage_zone">Damage Zone</option>
      <option value="boost_pad">Boost Pad</option>
    </select>
    <label id="directionLabel" style="display:none">Boost direction (degrees)
      <input id="boostDirection" type="number" value="0" min="0" max="360" step="15" style="width:80px" />
    </label>

    <label><input id="destructible" type="checkbox" /> Destructible wall</label>

    <div class="row">
      <button id="btnExport">Export JSON</button>
      <button id="btnImport">Import JSON</button>
      <button id="btnClear" class="warn">Clear All</button>
    </div>
    <textarea id="io"></textarea>
  </aside>

  <section class="viewport">
    <canvas id="canvas"></canvas>
    <div id="status" class="status"></div>
  </section>

  <script>
    const WORLD = { minX: -800, maxX: 800, minY: -600, maxY: 600 };
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const io = document.getElementById("io");
    const pickupTypeEl = document.getElementById("pickupType");
    const destructibleEl = document.getElementById("destructible");
    const zoneTypeEl = document.getElementById("zoneType");
    const boostDirectionEl = document.getElementById("boostDirection");
    const directionLabel = document.getElementById("directionLabel");

    const state = {
      walls: [],
      pickups: [],
      zones: [],
      nextId: 10000,
      tool: "wall",
      dragStart: null,
      preview: null,
      pan: { x: 0, y: 0, scale: 1 },
      panning: false,
      panStart: null,
    };

    const ZONE_COLORS = {
      slow_zone:   { fill: "rgba(255, 200, 60, 0.25)",  stroke: "rgba(255, 200, 60, 0.8)" },
      damage_zone: { fill: "rgba(255, 80, 80, 0.25)",   stroke: "rgba(255, 80, 80, 0.8)" },
      boost_pad:   { fill: "rgba(80, 255, 180, 0.25)",  stroke: "rgba(80, 255, 180, 0.8)" },
    };

    const toolButtons = {
      wall: document.getElementById("toolWall"),
      pickup: document.getElementById("toolPickup"),
      zone: document.getElementById("toolZone"),
      delete: document.getElementById("toolDelete"),
      pan: document.getElementById("toolPan"),
    };

    zoneTypeEl.addEventListener("change", () => {
      directionLabel.style.display = zoneTypeEl.value === "boost_pad" ? "" : "none";
    });

    function setTool(tool) {
      state.tool = tool;
      Object.entries(toolButtons).forEach(([name, btn]) => {
        btn.classList.toggle("active", name === tool);
      });
    }
    Object.entries(toolButtons).forEach(([name, btn]) => {
      btn.addEventListener("click", () => setTool(name));
    });

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }
    window.addEventListener("resize", resize);

    function worldToScreen(x, y) {
      const rect = canvas.getBoundingClientRect();
      const worldW = WORLD.maxX - WORLD.minX;
      const worldH = WORLD.maxY - WORLD.minY;
      const px = ((x - WORLD.minX) / worldW) * rect.width;
      const py = ((y - WORLD.minY) / worldH) * rect.height;
      return {
        x: (px - rect.width / 2) * state.pan.scale + rect.width / 2 + state.pan.x,
        y: (py - rect.height / 2) * state.pan.scale + rect.height / 2 + state.pan.y,
      };
    }

    function screenToWorld(px, py) {
      const rect = canvas.getBoundingClientRect();
      const unpanX = (px - rect.width / 2 - state.pan.x) / state.pan.scale + rect.width / 2;
      const unpanY = (py - rect.height / 2 - state.pan.y) / state.pan.scale + rect.height / 2;
      return {
        x: WORLD.minX + (unpanX / rect.width) * (WORLD.maxX - WORLD.minX),
        y: WORLD.minY + (unpanY / rect.height) * (WORLD.maxY - WORLD.minY),
      };
    }

    function newId() {
      state.nextId += 1;
      return state.nextId;
    }

    function drawGrid() {
      const rect = canvas.getBoundingClientRect();
      ctx.save();
      ctx.strokeStyle = "rgba(138, 185, 226, 0.18)";
      ctx.lineWidth = 1;
      for (let gx = -800; gx <= 800; gx += 100) {
        const a = worldToScreen(gx, -600);
        const b = worldToScreen(gx, 600);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      for (let gy = -600; gy <= 600; gy += 100) {
        const a = worldToScreen(-800, gy);
        const b = worldToScreen(800, gy);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      const tl = worldToScreen(-800, -600);
      const br = worldToScreen(800, 600);
      ctx.strokeStyle = "rgba(90, 212, 255, 0.6)";
      ctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
      ctx.restore();
    }

    function drawWalls() {
      for (const wall of state.walls) {
        const a = worldToScreen(wall.x, wall.y);
        const b = worldToScreen(wall.x + wall.width, wall.y + wall.height);
        ctx.fillStyle = wall.is_destructible ? "rgba(255, 198, 109, 0.36)" : "rgba(143, 197, 255, 0.35)";
        ctx.strokeStyle = wall.is_destructible ? "rgba(255, 198, 109, 0.9)" : "rgba(143, 197, 255, 0.95)";
        ctx.lineWidth = 1.6;
        ctx.fillRect(a.x, a.y, b.x - a.x, b.y - a.y);
        ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
      }
    }

    function drawPickups() {
      for (const pickup of state.pickups) {
        const p = worldToScreen(pickup.x, pickup.y);
        ctx.beginPath();
        ctx.fillStyle = "rgba(141, 255, 180, 0.88)";
        ctx.strokeStyle = "rgba(16, 64, 40, 0.9)";
        ctx.lineWidth = 1.4;
        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    }

    function drawZones() {
      for (const zone of state.zones) {
        const a = worldToScreen(zone.x, zone.y);
        const b = worldToScreen(zone.x + zone.width, zone.y + zone.height);
        const colors = ZONE_COLORS[zone.zone_type] || ZONE_COLORS.slow_zone;
        ctx.fillStyle = colors.fill;
        ctx.strokeStyle = colors.stroke;
        ctx.lineWidth = 1.8;
        ctx.setLineDash([6, 4]);
        ctx.fillRect(a.x, a.y, b.x - a.x, b.y - a.y);
        ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
        ctx.setLineDash([]);

        // Label
        ctx.fillStyle = colors.stroke;
        ctx.font = "11px sans-serif";
        const label = zone.zone_type.replace("_", " ");
        ctx.fillText(label, a.x + 4, a.y + 14);

        // Direction arrow for boost pads
        if (zone.zone_type === "boost_pad") {
          const cx = (a.x + b.x) / 2;
          const cy = (a.y + b.y) / 2;
          const rad = zone.direction || 0;
          const arrowLen = Math.min(b.x - a.x, b.y - a.y) * 0.35;
          const tipX = cx + Math.cos(rad) * arrowLen;
          const tipY = cy + Math.sin(rad) * arrowLen;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(tipX, tipY);
          ctx.strokeStyle = colors.stroke;
          ctx.lineWidth = 2.4;
          ctx.setLineDash([]);
          ctx.stroke();
          // Arrowhead
          const headLen = 6;
          ctx.beginPath();
          ctx.moveTo(tipX, tipY);
          ctx.lineTo(tipX - headLen * Math.cos(rad - 0.4), tipY - headLen * Math.sin(rad - 0.4));
          ctx.moveTo(tipX, tipY);
          ctx.lineTo(tipX - headLen * Math.cos(rad + 0.4), tipY - headLen * Math.sin(rad + 0.4));
          ctx.stroke();
        }
      }
    }

    function drawPreview() {
      if (!state.preview) return;
      const wall = state.preview;
      const a = worldToScreen(wall.x, wall.y);
      const b = worldToScreen(wall.x + wall.width, wall.y + wall.height);
      ctx.fillStyle = "rgba(90, 212, 255, 0.18)";
      ctx.strokeStyle = "rgba(90, 212, 255, 0.9)";
      ctx.setLineDash([5, 4]);
      ctx.fillRect(a.x, a.y, b.x - a.x, b.y - a.y);
      ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
      ctx.setLineDash([]);
    }

    function updateStatus() {
      statusEl.textContent = `Walls: ${state.walls.length} | Pickups: ${state.pickups.length} | Zones: ${state.zones.length} | Tool: ${state.tool}`;
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      drawGrid();
      drawZones();
      drawWalls();
      drawPickups();
      drawPreview();
      updateStatus();
    }

    function normalizeRect(a, b) {
      return {
        x: Math.min(a.x, b.x),
        y: Math.min(a.y, b.y),
        width: Math.abs(b.x - a.x),
        height: Math.abs(b.y - a.y),
      };
    }

    function hitWall(world) {
      return state.walls.findIndex((w) => world.x >= w.x && world.x <= w.x + w.width && world.y >= w.y && world.y <= w.y + w.height);
    }
    function hitPickup(world) {
      return state.pickups.findIndex((p) => (p.x - world.x) ** 2 + (p.y - world.y) ** 2 <= 14 ** 2);
    }
    function hitZone(world) {
      return state.zones.findIndex((z) => world.x >= z.x && world.x <= z.x + z.width && world.y >= z.y && world.y <= z.y + z.height);
    }

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const delta = Math.sign(e.deltaY);
      state.pan.scale = Math.min(2.5, Math.max(0.55, state.pan.scale + delta * -0.08));
      draw();
    }, { passive: false });

    canvas.addEventListener("mousedown", (e) => {
      const world = screenToWorld(e.offsetX, e.offsetY);
      if (state.tool === "pan") {
        state.panning = true;
        state.panStart = { x: e.clientX, y: e.clientY, panX: state.pan.x, panY: state.pan.y };
        return;
      }
      if (state.tool === "pickup") {
        state.pickups.push({ id: newId(), x: world.x, y: world.y, pickup_type: pickupTypeEl.value });
        draw();
        return;
      }
      if (state.tool === "delete") {
        const wi = hitWall(world);
        if (wi >= 0) { state.walls.splice(wi, 1); draw(); return; }
        const pi = hitPickup(world);
        if (pi >= 0) { state.pickups.splice(pi, 1); draw(); return; }
        const zi = hitZone(world);
        if (zi >= 0) { state.zones.splice(zi, 1); draw(); return; }
        return;
      }
      if (state.tool === "wall" || state.tool === "zone") {
        state.dragStart = world;
        state.preview = { id: 0, x: world.x, y: world.y, width: 1, height: 1, is_destructible: destructibleEl.checked };
      }
    });

    canvas.addEventListener("mousemove", (e) => {
      if (state.panning && state.panStart) {
        state.pan.x = state.panStart.panX + (e.clientX - state.panStart.x);
        state.pan.y = state.panStart.panY + (e.clientY - state.panStart.y);
        draw();
        return;
      }
      if (!state.dragStart || (state.tool !== "wall" && state.tool !== "zone")) return;
      const world = screenToWorld(e.offsetX, e.offsetY);
      const rect = normalizeRect(state.dragStart, world);
      state.preview = { id: 0, x: rect.x, y: rect.y, width: rect.width, height: rect.height, is_destructible: destructibleEl.checked };
      draw();
    });

    canvas.addEventListener("mouseup", (e) => {
      if (state.panning) {
        state.panning = false;
        state.panStart = null;
        return;
      }
      if (!state.dragStart || (state.tool !== "wall" && state.tool !== "zone")) return;
      const world = screenToWorld(e.offsetX, e.offsetY);
      const rect = normalizeRect(state.dragStart, world);
      if (rect.width >= 2 && rect.height >= 2) {
        if (state.tool === "zone") {
          const dirDeg = parseFloat(boostDirectionEl.value) || 0;
          state.zones.push({
            id: newId(),
            x: rect.x, y: rect.y, width: rect.width, height: rect.height,
            zone_type: zoneTypeEl.value,
            direction: dirDeg * (Math.PI / 180),
          });
        } else {
          state.walls.push({
            id: newId(),
            x: rect.x, y: rect.y, width: rect.width, height: rect.height,
            is_destructible: destructibleEl.checked,
            max_health: destructibleEl.checked ? 150 : 1000,
            current_health: destructibleEl.checked ? 150 : 1000,
          });
        }
      }
      state.dragStart = null;
      state.preview = null;
      draw();
    });

    function exportJson() {
      const payload = {
        walls: state.walls.map((w) => ({
          id: w.id,
          x: +w.x.toFixed(2),
          y: +w.y.toFixed(2),
          width: +w.width.toFixed(2),
          height: +w.height.toFixed(2),
          is_destructible: !!w.is_destructible,
          current_health: w.current_health || (w.is_destructible ? 150 : 1000),
          max_health: w.max_health || (w.is_destructible ? 150 : 1000),
        })),
        pickups: state.pickups.map((p) => ({
          id: p.id,
          x: +p.x.toFixed(2),
          y: +p.y.toFixed(2),
          pickup_type: p.pickup_type,
        })),
        zones: state.zones.map((z) => ({
          id: z.id,
          x: +z.x.toFixed(2),
          y: +z.y.toFixed(2),
          width: +z.width.toFixed(2),
          height: +z.height.toFixed(2),
          zone_type: z.zone_type,
          direction: +(z.direction || 0).toFixed(4),
        })),
      };
      io.value = JSON.stringify(payload, null, 2);
    }

    function importJson() {
      let parsed;
      try {
        parsed = JSON.parse(io.value);
      } catch (err) {
        alert("Invalid JSON");
        return;
      }
      state.walls = Array.isArray(parsed.walls) ? parsed.walls : [];
      state.pickups = Array.isArray(parsed.pickups) ? parsed.pickups : [];
      state.zones = Array.isArray(parsed.zones) ? parsed.zones : [];
      let maxId = 10000;
      for (const w of state.walls) maxId = Math.max(maxId, Number(w.id) || 0);
      for (const p of state.pickups) maxId = Math.max(maxId, Number(p.id) || 0);
      for (const z of state.zones) maxId = Math.max(maxId, Number(z.id) || 0);
      state.nextId = maxId + 1;
      draw();
    }

    document.getElementById("btnExport").addEventListener("click", exportJson);
    document.getElementById("btnImport").addEventListener("click", importJson);
    document.getElementById("btnClear").addEventListener("click", () => {
      if (!confirm("Clear all walls, pickups, and zones?")) return;
      state.walls = [];
      state.pickups = [];
      state.zones = [];
      draw();
    });

    resize();
  </script>
</body>
</html>
