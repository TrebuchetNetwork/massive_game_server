<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mobile Client</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 20% 20%, #1e293b, #020617 70%);
      color: #e2e8f0;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    }
    .shell {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 360px;
      padding: 18px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
    }
    .title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .hint { font-size: 13px; color: #cbd5e1; line-height: 1.4; margin-bottom: 12px; }
    .link { color: #93c5fd; text-decoration: none; }
  </style>
  <script>
    (() => {
      const target = new URL('/client.html', window.location.origin);
      target.searchParams.set('platform', 'mobile');
      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="title">Launching Mobile Client</div>
      <div class="hint">Loading touch controls and mobile gameplay profile.</div>
      <a class="link" href="/client.html?platform=mobile">Tap if redirect does not start</a>
    </div>
  </div>
</body>
</html>
