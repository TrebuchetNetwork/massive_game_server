name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # Keep CI release checks fast while still validating release-mode compilation.
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install FlatBuffers compiler
        run: scripts/install_flatc.sh

      - name: Repository hygiene guard
        run: scripts/check_repo_hygiene.sh

      - name: FlatBuffers consistency guard
        run: scripts/check_flatbuffers_consistency.sh

      - name: Cargo check (workspace)
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --locked

      - name: Format check
        run: cargo fmt --all --check --verbose

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --workspace --locked

      - name: Compile benches
        env:
          RUSTFLAGS: -D warnings
        run: cargo check -p massive_game_server_core --benches --locked

      - name: Build debug binary
        env:
          RUSTFLAGS: -D warnings
        run: cargo build -p massive_game_server_core --bin massive_game_server_core --locked

      - name: Build release binary
        env:
          RUSTFLAGS: -D warnings
        run: cargo build -p massive_game_server_core --release --bin massive_game_server_core --locked

      - name: Build release binary (jemalloc feature)
        env:
          RUSTFLAGS: -D warnings
        run: cargo build -p massive_game_server_core --release --features jemalloc --bin massive_game_server_core --locked

      - name: Docker build validation
        run: docker build -f docker/Dockerfile -t massive-game-server:ci-build .

      - name: Website route smoke test
        run: |
          set -euo pipefail
          MGS_HOST=0.0.0.0 \
          MGS_PORT=18080 \
          MGS_DISABLE_STUN=1 \
          MGS_TARGET_BOT_COUNT=0 \
          RUST_LOG=massive_game_server_core=warn,warp=warn,webrtc=warn \
            ./target/debug/massive_game_server_core > /tmp/mgs_ci_server.log 2>&1 &
          pid=$!
          trap 'kill $pid >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS -D /tmp/root_headers -o /tmp/root_body http://127.0.0.1:18080/ >/dev/null
          grep -qi '^location: /index.html' /tmp/root_headers
          curl -fsS http://127.0.0.1:18080/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:18080/index.html >/dev/null
          curl -fsS http://127.0.0.1:18080/client.html >/dev/null

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-smoke-logs
          path: |
            /tmp/mgs_ci_server.log
            /tmp/root_headers
            /tmp/root_body

  bench-regression:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      # Keep benches quick but consistent for regression checks.
      MGS_BENCH_WARMUP_TIME: "1.0"
      MGS_BENCH_MEASUREMENT_TIME: "0.6"
      MGS_BENCH_SAMPLE_SIZE: "20"
      MGS_BENCH_NRESAMPLES: "2000"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install FlatBuffers compiler
        run: scripts/install_flatc.sh

      - name: Run benchmark regression gate
        run: scripts/run_bench_regression.sh

      - name: Upload criterion output on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: criterion-bench-output
          path: target/criterion

  client-ui:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify Node runtime
        run: |
          node --version
          npm --version

      - name: Install client dependencies
        working-directory: static_client
        run: npm ci

      - name: Run UI unit tests
        working-directory: static_client
        run: npm run test:ui

      - name: Run UI coverage gate
        working-directory: static_client
        run: npm run test:ui:coverage

  playwright-e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CARGO_TERM_COLOR: always
      E2E_BASE_URL: http://127.0.0.1:18080
      E2E_WS_URL: ws://127.0.0.1:18080/ws
      E2E_SERVER_CMD: ./target/debug/massive_game_server_core
      E2E_SERVER_START_TIMEOUT_MS: "480000"
      MGS_HOST: 0.0.0.0
      MGS_PORT: 18080
      MGS_DISABLE_STUN: "1"
      MGS_TARGET_BOT_COUNT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install FlatBuffers compiler
        run: scripts/install_flatc.sh

      - name: Build debug server binary
        run: cargo build -p massive_game_server_core --bin massive_game_server_core --locked

      - name: Verify Node runtime
        run: |
          node --version
          npm --version

      - name: Install Playwright dependencies
        working-directory: scripts/e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: scripts/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: scripts/e2e
        run: |
          npx playwright test \
            tests \
            --workers=1

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-e2e-artifacts
          path: |
            scripts/e2e/test-results
            scripts/e2e/playwright-report

  playwright-cross-browser-critical:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      CARGO_TERM_COLOR: always
      E2E_BASE_URL: http://127.0.0.1:18081
      E2E_WS_URL: ws://127.0.0.1:18081/ws
      E2E_SERVER_CMD: ./target/debug/massive_game_server_core
      E2E_SERVER_START_TIMEOUT_MS: "480000"
      MGS_HOST: 0.0.0.0
      MGS_PORT: 18081
      MGS_DISABLE_STUN: "1"
      MGS_TARGET_BOT_COUNT: "0"
      PLAYWRIGHT_CROSS_BROWSER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install FlatBuffers compiler
        run: scripts/install_flatc.sh

      - name: Build debug server binary
        run: cargo build -p massive_game_server_core --bin massive_game_server_core --locked

      - name: Install Playwright dependencies
        working-directory: scripts/e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: scripts/e2e
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run cross-browser critical subset
        working-directory: scripts/e2e
        run: |
          npx playwright test \
            tests/connect.spec.js \
            tests/runtime.spec.js \
            --project=${{ matrix.browser }} \
            --workers=1

      - name: Upload cross-browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-cross-browser-${{ matrix.browser }}-artifacts
          path: |
            scripts/e2e/test-results
            scripts/e2e/playwright-report

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Dependency review
        uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803

  sast-codeql:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  coverage:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # Focused gate for deterministic core engine logic.
      COVERAGE_CORE_IGNORE_FILENAME_REGEX: '(^|.*/)src/(main\.rs|memory/|network/|operational/|routes/|scaling/|server/|state_sync/|world/boundary\.rs$)'
      # Broad gate keeps network/memory/server code in scope at a lower floor.
      COVERAGE_BROAD_IGNORE_FILENAME_REGEX: '(^|.*/)src/main\.rs$'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install FlatBuffers compiler
        run: scripts/install_flatc.sh

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@305bebabd4457bed9b82541755f034994382465b
        with:
          tool: cargo-llvm-cov

      - name: Run coverage test pass
        run: |
          cargo llvm-cov -p massive_game_server_core --locked --no-report \
            --ignore-filename-regex "${COVERAGE_CORE_IGNORE_FILENAME_REGEX}"

      - name: Enforce core coverage floor
        run: |
          cargo llvm-cov report -p massive_game_server_core --locked --summary-only \
            --ignore-filename-regex "${COVERAGE_CORE_IGNORE_FILENAME_REGEX}" \
            --fail-under-lines 70

      - name: Enforce broad coverage floor
        run: |
          cargo llvm-cov report -p massive_game_server_core --locked --summary-only \
            --ignore-filename-regex "${COVERAGE_BROAD_IGNORE_FILENAME_REGEX}" \
            --fail-under-lines 40

      - name: Generate LCOV report
        run: |
          cargo llvm-cov report -p massive_game_server_core --locked --lcov \
            --ignore-filename-regex "${COVERAGE_CORE_IGNORE_FILENAME_REGEX}" \
            --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-lcov
          path: lcov.info

  nightly-heavy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, beta]
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install FlatBuffers compiler
        run: scripts/install_flatc.sh

      - name: Repository hygiene guard
        run: scripts/check_repo_hygiene.sh

      - name: FlatBuffers consistency guard
        run: scripts/check_flatbuffers_consistency.sh

      - name: Cargo check (workspace)
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --locked

      - name: Run tests
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --workspace --locked

      - name: Build release binary
        env:
          RUSTFLAGS: -D warnings
        run: cargo build -p massive_game_server_core --release --bin massive_game_server_core --locked

  nightly-security:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@305bebabd4457bed9b82541755f034994382465b
        with:
          tool: cargo-audit

      - name: Cargo audit
        run: cargo audit --deny warnings

  container-security-scan:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Trivy filesystem scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            aquasec/trivy:0.69.1 \
            fs --scanners vuln --format table --ignore-unfixed --pkg-types os,library --severity CRITICAL,HIGH --exit-code 1 .

  daily-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install FlatBuffers compiler
        run: scripts/install_flatc.sh

      - name: Build debug binary
        env:
          RUSTFLAGS: -D warnings
        run: cargo build -p massive_game_server_core --bin massive_game_server_core --locked

      - name: Website route smoke test
        run: |
          set -euo pipefail
          MGS_HOST=0.0.0.0 \
          MGS_PORT=18080 \
          MGS_DISABLE_STUN=1 \
          MGS_TARGET_BOT_COUNT=0 \
          RUST_LOG=massive_game_server_core=warn,warp=warn,webrtc=warn \
            ./target/debug/massive_game_server_core > /tmp/mgs_daily_smoke.log 2>&1 &
          pid=$!
          trap 'kill $pid >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS -D /tmp/daily_root_headers -o /tmp/daily_root_body http://127.0.0.1:18080/ >/dev/null
          grep -qi '^location: /index.html' /tmp/daily_root_headers
          curl -fsS http://127.0.0.1:18080/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:18080/index.html >/dev/null
          curl -fsS http://127.0.0.1:18080/client.html >/dev/null
