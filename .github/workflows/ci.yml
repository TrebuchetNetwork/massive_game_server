name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # Keep CI release checks fast while still validating release-mode compilation.
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install FlatBuffers compiler
        run: scripts/install_flatc.sh

      - name: Repository hygiene guard
        run: scripts/check_repo_hygiene.sh

      - name: FlatBuffers consistency guard
        run: scripts/check_flatbuffers_consistency.sh

      - name: Cargo check (workspace)
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --locked

      - name: Format check
        run: cargo fmt --all --check --verbose

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --workspace --locked

      - name: Compile benches
        env:
          RUSTFLAGS: -D warnings
        run: cargo check -p massive_game_server_core --benches --locked

      - name: Build debug binary
        env:
          RUSTFLAGS: -D warnings
        run: cargo build -p massive_game_server_core --bin massive_game_server_core --locked

      - name: Build release binary
        env:
          RUSTFLAGS: -D warnings
        run: cargo build -p massive_game_server_core --release --bin massive_game_server_core --locked

      - name: Build release binary (jemalloc feature)
        env:
          RUSTFLAGS: -D warnings
        run: cargo build -p massive_game_server_core --release --features jemalloc --bin massive_game_server_core --locked

      - name: Docker build validation (best-effort)
        continue-on-error: true
        run: docker build -f docker/Dockerfile -t massive-game-server:ci-build .

      - name: Website route smoke test
        run: |
          set -euo pipefail
          MGS_HOST=0.0.0.0 \
          MGS_PORT=18080 \
          MGS_DISABLE_STUN=1 \
          MGS_TARGET_BOT_COUNT=0 \
          RUST_LOG=massive_game_server_core=warn,warp=warn,webrtc=warn \
            ./target/debug/massive_game_server_core > /tmp/mgs_ci_server.log 2>&1 &
          pid=$!
          trap 'kill $pid >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS -D /tmp/root_headers -o /tmp/root_body http://127.0.0.1:18080/ >/dev/null
          grep -qi '^location: /index.html' /tmp/root_headers
          curl -fsS http://127.0.0.1:18080/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:18080/index.html >/dev/null
          curl -fsS http://127.0.0.1:18080/client.html >/dev/null

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-smoke-logs
          path: |
            /tmp/mgs_ci_server.log
            /tmp/root_headers
            /tmp/root_body

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Dependency review
        uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803

  sast-codeql:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  coverage:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install FlatBuffers compiler
        run: scripts/install_flatc.sh

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@305bebabd4457bed9b82541755f034994382465b
        with:
          tool: cargo-llvm-cov

      - name: Enforce coverage floor
        run: cargo llvm-cov -p massive_game_server_core --locked --summary-only --fail-under-lines 53

      - name: Generate LCOV report
        run: cargo llvm-cov -p massive_game_server_core --locked --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-lcov
          path: lcov.info

  nightly-heavy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, beta]
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install FlatBuffers compiler
        run: scripts/install_flatc.sh

      - name: Repository hygiene guard
        run: scripts/check_repo_hygiene.sh

      - name: FlatBuffers consistency guard
        run: scripts/check_flatbuffers_consistency.sh

      - name: Cargo check (workspace)
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --locked

      - name: Run tests
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --workspace --locked

      - name: Build release binary
        env:
          RUSTFLAGS: -D warnings
        run: cargo build -p massive_game_server_core --release --bin massive_game_server_core --locked

  nightly-security:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@305bebabd4457bed9b82541755f034994382465b
        with:
          tool: cargo-audit

      - name: Cargo audit
        run: cargo audit --deny warnings

  container-security-scan:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.5
        with:
          version: v0.69.1

      - name: Trivy filesystem scan
        run: trivy fs --scanners vuln --format table --ignore-unfixed --pkg-types os,library --severity CRITICAL,HIGH --exit-code 1 .

  daily-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install FlatBuffers compiler
        run: scripts/install_flatc.sh

      - name: Build debug binary
        env:
          RUSTFLAGS: -D warnings
        run: cargo build -p massive_game_server_core --bin massive_game_server_core --locked

      - name: Website route smoke test
        run: |
          set -euo pipefail
          MGS_HOST=0.0.0.0 \
          MGS_PORT=18080 \
          MGS_DISABLE_STUN=1 \
          MGS_TARGET_BOT_COUNT=0 \
          RUST_LOG=massive_game_server_core=warn,warp=warn,webrtc=warn \
            ./target/debug/massive_game_server_core > /tmp/mgs_daily_smoke.log 2>&1 &
          pid=$!
          trap 'kill $pid >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS -D /tmp/daily_root_headers -o /tmp/daily_root_body http://127.0.0.1:18080/ >/dev/null
          grep -qi '^location: /index.html' /tmp/daily_root_headers
          curl -fsS http://127.0.0.1:18080/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:18080/index.html >/dev/null
          curl -fsS http://127.0.0.1:18080/client.html >/dev/null
