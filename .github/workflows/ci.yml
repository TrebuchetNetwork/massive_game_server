name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check-and-web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # Keep CI release checks fast while still validating release-mode compilation.
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install FlatBuffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler

      - name: Cargo check (workspace)
        run: cargo check --workspace --locked

      - name: Format check
        run: cargo fmt --all --check --verbose

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Compile benches
        run: cargo check -p massive_game_server_core --benches --locked

      - name: Build debug binary
        run: cargo build -p massive_game_server_core --bin massive_game_server_core --locked

      - name: Build release binary
        run: cargo build -p massive_game_server_core --release --bin massive_game_server_core --locked

      - name: Website route smoke test
        run: |
          set -euo pipefail
          MGS_HOST=0.0.0.0 \
          MGS_PORT=18080 \
          MGS_DISABLE_STUN=1 \
          MGS_TARGET_BOT_COUNT=0 \
          RUST_LOG=massive_game_server_core=warn,warp=warn,webrtc=warn \
            ./target/debug/massive_game_server_core > /tmp/mgs_ci_server.log 2>&1 &
          pid=$!
          trap 'kill $pid >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS -D /tmp/root_headers -o /tmp/root_body http://127.0.0.1:18080/ >/dev/null
          grep -qi '^location: /index.html' /tmp/root_headers
          curl -fsS http://127.0.0.1:18080/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:18080/index.html >/dev/null
          curl -fsS http://127.0.0.1:18080/client.html >/dev/null

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-logs
          path: |
            /tmp/mgs_ci_server.log
            /tmp/root_headers
            /tmp/root_body
