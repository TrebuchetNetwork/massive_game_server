name: Backup Restore Verify

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: backup-restore-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install FlatBuffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler

      - name: Verify backup restore roundtrip
        run: cargo test -p massive_game_server_core backup_roundtrip_restores_source_contents --locked -- --exact --nocapture
