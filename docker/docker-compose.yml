services:
  massive-game-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: massive-game-server:latest
    container_name: massive-game-server
    restart: unless-stopped
    environment:
      MGS_HOST: "0.0.0.0"
      MGS_PORT: "8080"
      MGS_ADMIN_BEARER_TOKEN: "${MGS_ADMIN_BEARER_TOKEN:-}"
      MGS_DISABLE_STUN: "${MGS_DISABLE_STUN:-1}"
      MGS_TARGET_BOT_COUNT: "${MGS_TARGET_BOT_COUNT:-0}"
      MGS_MAX_PLAYERS_PER_MATCH: "${MGS_MAX_PLAYERS_PER_MATCH:-200}"
      MGS_BEHIND_TLS_PROXY: "${MGS_BEHIND_TLS_PROXY:-0}"
      MGS_REQUIRE_AUTH: "${MGS_REQUIRE_AUTH:-0}"
      MGS_ALLOWED_ORIGINS: "${MGS_ALLOWED_ORIGINS:-https://game.trebuchet.network,http://127.0.0.1:18080,http://localhost:18080,http://127.0.0.1:8080,http://localhost:8080}"
      MGS_REDIS_URL: "redis://:${MGS_REDIS_PASSWORD:-mgs_redis_dev_password}@redis:6379/"
      MGS_METRICS_ENABLED: "true"
      MGS_METRICS_BIND_ADDR: "${MGS_METRICS_BIND_ADDR:-0.0.0.0:9090}"
      RUST_LOG: "${RUST_LOG:-massive_game_server_core=info,warp=warn,webrtc=warn}"
      MGS_LOG_FORMAT: "${MGS_LOG_FORMAT:-json}"
      MGS_WEBRTC_UDP_PORT_MIN: "${MGS_WEBRTC_UDP_PORT_MIN:-50000}"
      MGS_WEBRTC_UDP_PORT_MAX: "${MGS_WEBRTC_UDP_PORT_MAX:-50500}"
      MGS_WEBRTC_NAT_1TO1_IPS: "${MGS_WEBRTC_NAT_1TO1_IPS:-127.0.0.1}"
      MGS_WEBRTC_NAT_1TO1_CANDIDATE_TYPE: "${MGS_WEBRTC_NAT_1TO1_CANDIDATE_TYPE:-host}"
      OPENROUTER_API_KEY_FILE: "/run/secrets/openrouter_api_key"
    ports:
      - "127.0.0.1:${MGS_SERVER_BIND_PORT:-8080}:8080"
      - "127.0.0.1:${MGS_WEBRTC_UDP_PORT_MIN:-50000}-${MGS_WEBRTC_UDP_PORT_MAX:-50500}:${MGS_WEBRTC_UDP_PORT_MIN:-50000}-${MGS_WEBRTC_UDP_PORT_MAX:-50500}/udp"
    volumes:
      - mgs_data:/app/data
      - mgs_artifacts:/app/artifacts
      - ./logs:/app/logs
    secrets:
      - openrouter_api_key
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 4s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G
    networks:
      - game-network

  redis:
    image: redis:7-alpine
    container_name: massive-game-server-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-ttl --requirepass ${MGS_REDIS_PASSWORD:-mgs_redis_dev_password}
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - game-network

  nginx:
    image: nginx:1.27-alpine
    container_name: massive-game-server-nginx
    restart: unless-stopped
    depends_on:
      - massive-game-server
      - grafana
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - game-network

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: massive-game-server-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    networks:
      - game-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: massive-game-server-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER__FILE: "/run/secrets/grafana_admin_user"
      GF_SECURITY_ADMIN_PASSWORD__FILE: "/run/secrets/grafana_admin_password"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-https://game.trebuchet.network/grafana}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboard-json:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    secrets:
      - grafana_admin_user
      - grafana_admin_password
    networks:
      - game-network

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: massive-game-server-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - game-network

volumes:
  mgs_data:
  mgs_artifacts:
  redis_data:
  nginx_cache:
  prometheus_data:
  grafana_data:

secrets:
  openrouter_api_key:
    file: ${OPENROUTER_API_KEY_SECRET_FILE:-./secrets/openrouter_api_key}
  grafana_admin_user:
    file: ${GRAFANA_ADMIN_USER_SECRET_FILE:-./secrets/grafana_admin_user}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_SECRET_FILE:-./secrets/grafana_admin_password}

networks:
  game-network:
    driver: bridge
