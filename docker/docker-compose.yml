services:
  massive-game-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: massive-game-server:latest
    container_name: massive-game-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MGS_HOST: "0.0.0.0"
      MGS_PORT: "8080"
      MGS_DISABLE_STUN: "1"
      MGS_TARGET_BOT_COUNT: "0"
      RUST_LOG: "massive_game_server_core=warn,warp=warn,webrtc=warn"
      # Set for real provider code generation in arena endpoints.
      # OPENROUTER_API_KEY: "..."
    volumes:
      - mgs_data:/app/data
      - mgs_artifacts:/app/artifacts
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: massive-game-server-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  nginx:
    image: nginx:1.27-alpine
    container_name: massive-game-server-nginx
    restart: unless-stopped
    depends_on:
      - massive-game-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  mgs_data:
  mgs_artifacts:
